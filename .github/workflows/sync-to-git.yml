# 把 Release 资产搬进 git 目录。
#
# 为什么必须搬（实测证据，不是推测）：
#   浏览器地址栏能瞬间下载，Worker 里的 fetch 却报 NetworkError。
#   两者规则的差别在这里：
#     · 地址栏 = 顶层导航，不做 CORS 检查 → 能下
#     · fetch  = CORS 模式，且直链会 302 跳到另一个域名 → 被挡
#   实测响应头：
#     github.com/.../releases/download/  → Access-Control-Allow-Origin: （无）
#     raw.githubusercontent.com/...      → Access-Control-Allow-Origin: *
#     cdn.jsdelivr.net/gh/...            → Access-Control-Allow-Origin: *
#
#   只要文件存在于 **git 目录**，就能从后两个域取到，且都带 ACAO:*。
#   跨域问题从根上消失 —— 不用改我们的代码去"绕过"什么。
#
# 因此取舍改了：
#   原先 .gitignore 写"抓下来的文件不进 git，二进制只增不减"。
#   那条理由是为了让 clone 快，代价是文件只能从 Release 取，
#   而 Release 下载端点恰恰是 fetch 拿不到 CORS 头的那个。
#   现在宁可 clone 慢一点，也要让浏览器真能取到 ——
#   取不到的话，这些资源等于不存在。
#
# 为什么由 Actions 搬：
#   沙箱访问 Release 下载端点实测 403（本机 IP 与 Actions 机房不同）。
#   Actions 用 gh 走认证 API，不受此限。
#
# 为什么主逻辑是 Python 脚本而不是内联 shell：
#   第一版用 shell，失败时 _diag 没推回仓库，只看到 job failure，
#   不知道为什么失败 —— 等于瞎猜。Python 版保证日志一定落盘。

name: 资产搬进 git 目录

on:
  workflow_dispatch:
    inputs:
      target:
        description: '搬哪个（建议先 sqlite 验证链路）'
        required: true
        default: 'sqlite'
        type: choice
        options:
          - sqlite
          - lua
          - quickjs
          - pyodide
          - php
          - ruby
          - cpp
          - all

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: 搬
        id: mirror
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ github.event.inputs.target }}
        run: python3 scripts/mirror_assets.py

      - name: 提交
        run: |
          set -uo pipefail
          git config user.name "asset-mirror"
          git config user.email "actions@users.noreply.github.com"
          git add -f rt _diag
          if git diff --cached --quiet; then
            echo "（无变化）"
          else
            git commit -m "资产搬进 git 目录（${{ github.event.inputs.target }}）$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin main
          fi

      - name: 结论
        if: steps.mirror.outcome == 'failure'
        run: |
          echo "::error::搬运失败，详见 _diag/mirror.log"
          exit 1
