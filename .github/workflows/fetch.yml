# 抓取大体积运行时资源。
#
# 为什么不直接提交进仓库：
#   git 存二进制是"只增不减" —— 放进去一次，clone 就再也快不起来了。
#   Release 资产不影响 clone：只有真要用的人才会下载那一个文件。
#
# 为什么不放在主仓库：
#   主仓库的约束是"零依赖、拿到就能跑"。这些是按需加载的可选资源，
#   混进去会破坏那条约束。
#
# 为什么必须由 Actions 抓：
#   沙箱环境的出站请求被网络策略挡住（实测 502 / 403），拿不到 CDN。
#   Actions 的出站是通的。这是环境差异，不是配置问题。

name: 抓取运行时资源

on:
  workflow_dispatch:
    inputs:
      target:
        description: '要抓哪个'
        required: true
        default: 'all'
        type: choice
        options: [all, sqljs, lua, quickjs, pyodide, ruby, php]
      tag:
        description: 'Release 标签（默认 latest）'
        required: false
        default: 'latest'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: 抓取资源
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ github.event.inputs.target }}
        run: python3 scripts/fetch.py --target "$TARGET" --out dist

      - name: 发布为 Release 资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: python3 scripts/publish.py --repo "${{ github.repository }}" --dir dist --tag "$TAG"

      - name: 更新清单
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/manifest.py --repo "${{ github.repository }}" --dir dist

      # 日志写回：沙箱下载不到 Actions 的产物，只能把关键输出
      # 写成文件推回仓库再读。诊断步骤永远不影响 job 结论。
      - name: 日志写回
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "run: ${{ github.run_id }} / target: ${{ github.event.inputs.target }}"
            echo "--- dist 内容 ---"
            ls -la dist 2>/dev/null || echo "(dist 不存在)"
            echo "--- _fetched.json ---"
            cat dist/_fetched.json 2>/dev/null || echo "(无)"
            echo "--- manifest.json ---"
            cat manifest.json 2>/dev/null || echo "(无)"
          } > _log.txt 2>&1
          python3 - <<'PY'
          import os, json, base64, urllib.request
          tok = os.environ['GH_TOKEN']; repo = os.environ['GITHUB_REPOSITORY']
          path = '_log.txt'
          body = open(path, 'rb').read()
          def api(m, p, b=None):
              r = urllib.request.Request('https://api.github.com/repos/%s/contents/%s' % (repo, p),
                  method=m, headers={'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json',
                  'User-Agent':'diag'}, data=json.dumps(b).encode() if b else None)
              return json.load(urllib.request.urlopen(r, timeout=30))
          try:
              cur = api('GET', path); sha = cur['sha']
              api('PUT', path, {'message':'更新抓取日志','content':base64.b64encode(body).decode(),'sha':sha})
          except Exception:
              api('PUT', path, {'message':'写入抓取日志','content':base64.b64encode(body).decode()})
          print('日志已写回')
          PY
